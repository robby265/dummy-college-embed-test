<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

iframe {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
    border: none;
}
</style>
</head>
<body>

<iframe
    src="https://ar-vr-sooty.vercel.app/tours/19a95946-f0cf-45f5-aa2b-78d2853b4d2c/preview"
    allow="fullscreen; accelerometer; gyroscope; magnetometer; xr-spatial-tracking; autoplay; camera; microphone"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen>
</iframe>

</body>
</html>
